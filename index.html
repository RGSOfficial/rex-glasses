<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rex AI Assistant</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151d30;
      --card-border: #232f48;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title-group h1 { font-size: 1.4rem; font-weight: 700; }

    .status-pill {
      font-size: 0.75rem; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; background: #1e293b; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .status-pill.listening { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-pill.thinking { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-pill.speaking { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }

    .device-panel {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

    select {
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); padding: 8px 10px; border-radius: 6px;
      font-size: 0.85rem; outline: none; cursor: pointer; width: 100%;
    }

    .display-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .box {
      background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 14px; min-height: 60px;
    }

    .box-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .box-content { font-size: 0.95rem; line-height: 1.4; word-break: break-word; }

    .primary-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent-blue); color: #ffffff; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: background 0.2s ease;
    }
    .primary-btn:hover { background: var(--accent-blue-hover); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group"><h1>Rex Glasses v1.0.6</h1></div>
      <div id="statusPill" class="status-pill">Idle</div>
    </div>

    <div class="device-panel">
      <div class="control-group">
        <label for="micSelect">Microphone Input</label>
        <select id="micSelect" onchange="bindMicrophoneStream()">
          <option value="">Select Microphone</option>
        </select>
      </div>
    </div>

    <div class="display-area">
      <div class="box">
        <div class="box-label">You Said</div>
        <div id="userSpeech" class="box-content" style="color: var(--text-muted);">Tap start and speak...</div>
      </div>

      <div class="box">
        <div class="box-label">Rex Response</div>
        <div id="rexResponse" class="box-content" style="color: var(--text-muted);">Awaiting query...</div>
      </div>
    </div>

    <button id="toggleBtn" class="primary-btn" onclick="toggleListening()">Start Listening</button>
  </div>

  <script>
    const LOCAL_BACKEND_URL = "https://gonna-codes-the-madrid.trycloudflare.com/api/speak";
    const NGROK_LLM_URL = "https://undivided-parrot-skinny.ngrok-free.dev/v1/chat/completions";
    const MODEL_NAME = "gemma-4-e4b-uncensored-hauhaucs-aggressive";
    const SPEECH_PLAYBACK_RATE = 1.25;

    let recognition = null;
    let isListening = false;
    let isProcessing = false;
    let activeMediaStream = null;

    const micSelect = document.getElementById("micSelect");

    async function loadAudioDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        micSelect.innerHTML = "";

        devices.forEach(device => {
          if (device.kind === "audioinput" && device.deviceId) {
            const option = document.createElement("option");
            option.value = device.deviceId;
            option.text = device.label || `Microphone ${micSelect.length + 1}`;
            micSelect.appendChild(option);
          }
        });
        bindMicrophoneStream();
      } catch (err) {
        console.error("Audio device access error:", err);
      }
    }

    async function bindMicrophoneStream() {
      const selectedMicId = micSelect.value;
      try {
        if (activeMediaStream) {
          activeMediaStream.getTracks().forEach(track => track.stop());
        }
        activeMediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: selectedMicId ? { exact: selectedMicId } : undefined,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
      } catch (e) {
        console.error("Failed to bind microphone stream:", e);
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        if (isProcessing) return;

        const transcript = event.results[0][0].transcript.trim();
        if (!transcript) return;

        const userBox = document.getElementById("userSpeech");
        userBox.innerText = transcript;
        userBox.style.color = "var(--text-main)";

        processSpeechInput(transcript);
      };

      // Automatically restart listening when recognition ends naturally
      recognition.onend = () => {
        if (isListening && !isProcessing) {
          try { recognition.start(); } catch(e){}
        }
      };

      recognition.onerror = (err) => {
        if (err.error !== "no-speech" && isListening && !isProcessing) {
          setTimeout(() => { try { recognition.start(); } catch(e){} }, 300);
        }
      };
    }

    function updateStatus(state, text) {
      const pill = document.getElementById("statusPill");
      pill.className = `status-pill ${state}`;
      pill.innerText = text;
    }

    async function toggleListening() {
      const btn = document.getElementById("toggleBtn");
      
      if (!isListening) {
        // Unlock browser audio context on user click
        const unlockAudio = new Audio();
        unlockAudio.play().catch(() => {});

        await bindMicrophoneStream();
        try { recognition.start(); } catch(e){}
        isListening = true;
        btn.innerText = "Stop Listening";
        btn.style.background = "#dc2626";
        updateStatus("listening", "Listening");
      } else {
        isListening = false;
        try { recognition.stop(); } catch(e){}
        btn.innerText = "Start Listening";
        btn.style.background = "var(--accent-blue)";
        updateStatus("", "Idle");
      }
    }

    function processSpeechInput(rawText) {
      if (!rawText || isProcessing) return;
      let query = rawText.replace(/^(?:hey|hi|ok|yo|rex|wrecks)\s+/gi, "").trim();

      if (query.length > 0) {
        handleRexPipeline(query);
      }
    }

    async function handleRexPipeline(queryText) {
      isProcessing = true;
      try { recognition.stop(); } catch(e){}
      updateStatus("thinking", "Thinking");

      try {
        const llmResponse = await fetch(NGROK_LLM_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json", 
            "ngrok-skip-browser-warning": "true" 
          },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: [
              { role: "system", content: "You are Rex, a helpful AI assistant. Keep responses brief, clear, and conversational for speech output. Do NOT use emojis, special symbols, or markdown." },
              { role: "user", content: queryText }
            ]
          })
        });

        if (!llmResponse.ok) throw new Error("LLM backend error.");
        const llmData = await llmResponse.json();
        const rexReply = llmData.choices[0].message.content;

        document.getElementById("rexResponse").innerText = rexReply;
        document.getElementById("rexResponse").style.color = "var(--text-main)";

        updateStatus("speaking", "Speaking");
        const ttsResponse = await fetch(LOCAL_BACKEND_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({ text: rexReply, voice: "am_michael" })
        });

        if (!ttsResponse.ok) throw new Error("TTS generation failed.");

        const audioBlob = await ttsResponse.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        const audio = new Audio(audioUrl);
        audio.playbackRate = SPEECH_PLAYBACK_RATE;

        // Automatically resume listening after Rex finishes speaking
        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          isProcessing = false;
          if (isListening) {
            updateStatus("listening", "Listening");
            try { recognition.start(); } catch(e){}
          } else {
            updateStatus("", "Idle");
          }
        };

        await audio.play();

      } catch (error) {
        console.error("Pipeline Error:", error);
        document.getElementById("rexResponse").innerText = "Error: " + error.message;
        isProcessing = false;
        if (isListening) {
          updateStatus("listening", "Listening");
          try { recognition.start(); } catch(e){}
        }
      }
    }

    navigator.mediaDevices.addEventListener("devicechange", loadAudioDevices);
    loadAudioDevices();
  </script>
</body>
</html>
